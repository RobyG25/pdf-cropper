<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Cropper — חיתוך אמיתי</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap');
  :root {
    --bg:#0f0f13;--surface:#1a1a22;--surface2:#22222d;--border:#2e2e3d;
    --accent:#6c63ff;--text:#e8e8f0;--text2:#8888a0;--success:#4caf82;--radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:ltr}
  header{padding:1.25rem 2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:1rem;background:var(--surface)}
  .logo{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px}
  header h1{font-size:19px;font-weight:700}
  header p{font-size:12px;color:var(--text2);direction:rtl}
  .container{max-width:1400px;margin:0 auto;padding:1.5rem 2rem}
  #dropZone{border:2px dashed var(--border);border-radius:var(--radius);padding:4rem 2rem;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface)}
  #dropZone:hover,#dropZone.dragover{border-color:var(--accent);background:rgba(108,99,255,.07)}
  #dropZone .icon{font-size:44px;margin-bottom:1rem}
  #dropZone h2{font-size:20px;font-weight:500;margin-bottom:.4rem}
  #dropZone p{color:var(--text2);font-size:13px;direction:rtl}
  #fileInput{display:none}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-family:'Heebo',sans-serif;font-size:13px;font-weight:500;transition:all .15s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#7c74ff}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn-success{background:var(--success);color:#fff}
  .btn-success:hover{background:#5dc797}
  .btn-success:disabled,.btn-ghost:disabled{opacity:.4;cursor:not-allowed}
  .btn-sm{padding:5px 11px;font-size:12px}
  #mainLayout{display:none;gap:1.25rem;flex-direction:column}
  #mainLayout.active{display:flex}
  .toolbar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:var(--radius);padding:.9rem 1.25rem;border:1px solid var(--border);flex-wrap:wrap;gap:.75rem}
  .toolbar-left{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
  .file-info{font-size:13px;color:var(--text2)}
  .file-info strong{color:var(--text)}
  #hint{font-size:12px;color:var(--text2);direction:rtl;padding:.25rem 0}
  #pagesGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.25rem}
  .page-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;transition:border-color .2s}
  .page-card.has-crop{border-color:rgba(108,99,255,.5)}
  .card-head{display:flex;align-items:center;justify-content:space-between;padding:.65rem .9rem;background:var(--surface2);border-bottom:1px solid var(--border)}
  .page-label{font-size:13px;font-weight:500}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--text2);border:1px solid var(--border)}
  .badge.ok{background:rgba(76,175,130,.15);color:var(--success);border-color:rgba(76,175,130,.3)}
  .canvas-wrap{position:relative;background:#0a0a0e;display:flex;align-items:center;justify-content:center;min-height:180px;cursor:crosshair;user-select:none;overflow:hidden}
  .canvas-wrap canvas{display:block;max-width:100%}
  .card-foot{padding:.6rem .9rem;display:flex;align-items:center;gap:.5rem;border-top:1px solid var(--border);flex-wrap:wrap}
  .crop-info{font-size:11px;color:var(--text2);margin-right:auto;direction:rtl}
  .crop-info span{color:var(--accent)}
  .spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:2rem auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .progress-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
  .progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .25s;width:0}
  #statusMsg{font-size:12px;color:var(--text2);margin-top:.4rem;direction:rtl;min-height:1.2em}
  @media(max-width:600px){.container{padding:1rem}#pagesGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">✂️</div>
  <div>
    <h1>PDF Cropper</h1>
    <p>חיתוך אמיתי — התוכן מחוץ לאזור נמחק לגמרי מהקובץ</p>
  </div>
</header>
<div class="container">
  <div id="dropZone" onclick="document.getElementById('fileInput').click()">
    <div class="icon">📄</div>
    <h2>גרור PDF לכאן</h2>
    <p>או לחץ לבחירת קובץ</p><br>
    <button class="btn btn-primary" onclick="event.stopPropagation();document.getElementById('fileInput').click()">📂 בחר קובץ PDF</button>
    <input type="file" id="fileInput" accept=".pdf">
  </div>

  <div id="mainLayout">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="file-info"><strong id="fileName">—</strong> &nbsp;·&nbsp; <strong id="pageCount">—</strong> עמודים</div>
        <button class="btn btn-ghost btn-sm" onclick="resetAll()">🔄 קובץ חדש</button>
      </div>
      <div style="display:flex;align-items:center;gap:.75rem">
        <button class="btn btn-ghost btn-sm" onclick="resetAll()" title="טען קובץ אחר">📂 קובץ חדש</button>
        <button class="btn btn-success" id="dlBtn" onclick="downloadCropped()" disabled>⬇️ הורד PDF מחותך</button>
      </div>
    </div>
    <div id="progressWrap" style="display:none">
      <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
      <div id="statusMsg"></div>
    </div>
    <p id="hint">✏️ גרור עם העכבר על כל עמוד לסימון אזור החיתוך. "החל על כולם" מעתיק חיתוך לכל העמודים.</p>
    <div id="pagesGrid"></div>
  </div>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfBytes=null, pdfJsDoc=null, numPages=0;
const pages=[];   // {canvasEl,canvasW,canvasH,pdfW,pdfH,pdfX,pdfY,crop,overlayEl}

// ── File ──────────────────────────────────────────────────────────────────────
const fi=document.getElementById('fileInput');
fi.addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0])});
// Allow re-selecting the same file after reset
fi.addEventListener('click',()=>{fi.value='';});
const dz=document.getElementById('dropZone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover')});
dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])});

async function loadFile(file){
  dz.style.display='none';
  document.getElementById('mainLayout').classList.add('active');
  document.getElementById('fileName').textContent=file.name;
  showProg(0,1,'טוען...');
  pdfBytes=await file.arrayBuffer();
  pdfJsDoc=await pdfjsLib.getDocument({data:pdfBytes.slice(0)}).promise;
  numPages=pdfJsDoc.numPages;
  document.getElementById('pageCount').textContent=numPages;
  pages.length=0;
  document.getElementById('pagesGrid').innerHTML='';

  // Pre-load pdf-lib once for all page dims
  const plibDoc=await PDFLib.PDFDocument.load(pdfBytes);

  for(let i=1;i<=numPages;i++){
    showProg(i-1,numPages,`מרנדר עמוד ${i}/${numPages}...`);
    buildCard(i);
    await renderPage(i,plibDoc);
  }
  hideProg();
  document.getElementById('dlBtn').disabled=false;
}

function buildCard(i){
  const grid=document.getElementById('pagesGrid');
  const card=document.createElement('div');
  card.className='page-card';card.id=`card-${i}`;
  card.innerHTML=`
    <div class="card-head">
      <span class="page-label">עמוד ${i}</span>
      <span class="badge" id="badge-${i}">ללא חיתוך</span>
    </div>
    <div class="canvas-wrap" id="wrap-${i}"><div class="spinner"></div></div>
    <div class="card-foot">
      <span class="crop-info" id="info-${i}">—</span>
      <button class="btn btn-ghost btn-sm" onclick="applyToAll(${i})">📋 החל על כולם</button>
      <button class="btn btn-ghost btn-sm" onclick="clearCrop(${i})">✖</button>
    </div>`;
  grid.appendChild(card);
  pages[i-1]={canvasEl:null,canvasW:0,canvasH:0,pdfW:0,pdfH:0,pdfX:0,pdfY:0,crop:null,overlayEl:null};
}

async function renderPage(i,plibDoc){
  const idx=i-1;
  const pjsPage=await pdfJsDoc.getPage(i);
  // Get page rotation and compute correct viewport
  // Some PDFs have pages rotated 90/180/270 — we render with rotation=0
  // and apply CSS transform so the preview looks correct
  const baseVp=pjsPage.getViewport({scale:1, rotation:0});
  // Use the larger dimension to compute scale, so rotated pages aren't tiny
  const baseLong = Math.max(baseVp.width, baseVp.height);
  const scale = Math.min(Math.max(900/baseLong, 1.0), 4.0);
  const vp=pjsPage.getViewport({scale, rotation:0});
  const canvas=document.createElement('canvas');
  canvas.width=vp.width;canvas.height=vp.height;

  // Apply CSS rotation if the page has an inherent rotation
  const pageRotation = pjsPage.rotate || 0;
  if(pageRotation===90||pageRotation===270){
    canvas.style.transform=`rotate(${pageRotation}deg)`;
    canvas.style.transformOrigin='center center';
    // Swap wrap dimensions so card fits rotated canvas
    canvas.style.margin = `${(vp.width-vp.height)/2}px ${(vp.height-vp.width)/2}px`;
  } else if(pageRotation===180){
    canvas.style.transform='rotate(180deg)';
    canvas.style.transformOrigin='center center';
  }
  pages[idx].pageRotation = pageRotation;

  await pjsPage.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;

  const wrap=document.getElementById(`wrap-${i}`);
  wrap.innerHTML='';wrap.appendChild(canvas);

  const plibPage=plibDoc.getPage(idx);
  const mb=plibPage.getMediaBox();

  pages[idx].canvasEl=canvas;
  pages[idx].canvasW=canvas.width;pages[idx].canvasH=canvas.height;
  pages[idx].pdfW=mb.width;pages[idx].pdfH=mb.height;
  pages[idx].pdfX=mb.x||0;pages[idx].pdfY=mb.y||0;

  attachDrag(i,wrap,canvas);
}

// ── Drag ──────────────────────────────────────────────────────────────────────
function attachDrag(i,wrap,canvas){
  let active=false,sx=0,sy=0;
  function cpos(e){
    const r=canvas.getBoundingClientRect();
    const kx=canvas.width/r.width,ky=canvas.height/r.height;
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    return{x:Math.max(0,Math.min(canvas.width,(cx-r.left)*kx)),
           y:Math.max(0,Math.min(canvas.height,(cy-r.top)*ky))};
  }
  canvas.addEventListener('mousedown',e=>{if(e.button!==0)return;active=true;({x:sx,y:sy}=cpos(e));e.preventDefault()});
  canvas.addEventListener('touchstart',e=>{active=true;({x:sx,y:sy}=cpos(e));e.preventDefault()},{passive:false});
  window.addEventListener('mousemove',e=>{if(!active)return;const p=cpos(e);drawOv(i,sx,sy,p.x,p.y)});
  canvas.addEventListener('touchmove',e=>{if(!active)return;const p=cpos(e);drawOv(i,sx,sy,p.x,p.y);e.preventDefault()},{passive:false});
  function fin(ex,ey){
    if(!active)return;active=false;
    const x=Math.min(sx,ex),y=Math.min(sy,ey),w=Math.abs(ex-sx),h=Math.abs(ey-sy);
    if(w>5&&h>5){pages[i-1].crop={x,y,w,h};drawOv(i,sx,sy,ex,ey);updateBadge(i)}
    else clearCrop(i);
  }
  window.addEventListener('mouseup',e=>{const p=cpos(e);fin(p.x,p.y)});
  canvas.addEventListener('touchend',e=>{
    const t=e.changedTouches[0],r=canvas.getBoundingClientRect();
    const kx=canvas.width/r.width,ky=canvas.height/r.height;
    fin((t.clientX-r.left)*kx,(t.clientY-r.top)*ky);
  });
}

function drawOv(i,x1,y1,x2,y2){
  const pd=pages[i-1];const wrap=document.getElementById(`wrap-${i}`);
  if(!pd.canvasEl)return;
  if(!pd.overlayEl){
    pd.overlayEl=document.createElement('div');
    pd.overlayEl.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;';
    wrap.style.position='relative';wrap.appendChild(pd.overlayEl);
  }
  const r=pd.canvasEl.getBoundingClientRect();
  const kx=r.width/pd.canvasW,ky=r.height/pd.canvasH;
  const rx=Math.min(x1,x2)*kx,ry=Math.min(y1,y2)*ky;
  const rw=Math.abs(x2-x1)*kx,rh=Math.abs(y2-y1)*ky;
  const pw=r.width;
  pd.overlayEl.innerHTML=`
    <div style="position:absolute;top:0;left:0;width:${pw}px;height:${ry}px;background:rgba(0,0,0,.55)"></div>
    <div style="position:absolute;top:${ry+rh}px;left:0;width:${pw}px;bottom:0;background:rgba(0,0,0,.55)"></div>
    <div style="position:absolute;top:${ry}px;left:0;width:${rx}px;height:${rh}px;background:rgba(0,0,0,.55)"></div>
    <div style="position:absolute;top:${ry}px;left:${rx+rw}px;right:0;height:${rh}px;background:rgba(0,0,0,.55)"></div>
    <div style="position:absolute;top:${ry}px;left:${rx}px;width:${rw}px;height:${rh}px;border:2px solid #6c63ff"></div>`;
  const scx=pd.pdfW/pd.canvasW,scy=pd.pdfH/pd.canvasH;
  document.getElementById(`info-${i}`).innerHTML=
    `גודל: <span>${Math.round(Math.abs(x2-x1)*scx)} × ${Math.round(Math.abs(y2-y1)*scy)}</span> pt`;
}

function updateBadge(i){
  const b=document.getElementById(`badge-${i}`),c=document.getElementById(`card-${i}`);
  if(pages[i-1].crop){b.textContent='✓ מסומן';b.className='badge ok';c.classList.add('has-crop')}
  else{b.textContent='ללא חיתוך';b.className='badge';c.classList.remove('has-crop')}
}
function clearCrop(i){
  pages[i-1].crop=null;
  if(pages[i-1].overlayEl)pages[i-1].overlayEl.innerHTML='';
  document.getElementById(`info-${i}`).innerHTML='—';
  updateBadge(i);
}
function applyToAll(src){
  const pd=pages[src-1];
  if(!pd.crop){alert('סמן חיתוך בעמוד הזה קודם.');return}
  const rx=pd.crop.x/pd.canvasW,ry=pd.crop.y/pd.canvasH;
  const rw=pd.crop.w/pd.canvasW,rh=pd.crop.h/pd.canvasH;
  for(let i=1;i<=numPages;i++){
    if(i===src)continue;
    const t=pages[i-1];if(!t.canvasW)continue;
    t.crop={x:rx*t.canvasW,y:ry*t.canvasH,w:rw*t.canvasW,h:rh*t.canvasH};
    drawOv(i,t.crop.x,t.crop.y,t.crop.x+t.crop.w,t.crop.y+t.crop.h);
    updateBadge(i);
  }
}

// ── TRUE HARD-CODED CROP ──────────────────────────────────────────────────────
// Each cropped page is rebuilt from scratch:
//   1. Embed original page as Form XObject into the output doc
//   2. Resize the page to the exact crop dimensions
//   3. Write a new content stream: clip rect → translate → draw XObject
//   The content outside the crop rect is never drawn — it does not exist.
async function downloadCropped(){
  document.getElementById('dlBtn').disabled=true;
  const fileName = document.getElementById('fileName').textContent || 'document';
  showProg(0,numPages,'מכין...');
  try{
    // Load two independent copies: one to edit, one as embed source
    const doc    = await PDFLib.PDFDocument.load(pdfBytes);
    const srcDoc = await PDFLib.PDFDocument.load(pdfBytes);
    const total  = doc.getPageCount();

    for(let i=1;i<=total;i++){
      showProg(i-1,total,`מחתך עמוד ${i}/${total}...`);
      const pd=pages[i-1];
      if(!pd||!pd.crop)continue;

      // ── Convert canvas crop → PDF point space ──────────────────────────────
      // Must account for page rotation: canvas is always rendered at rotation=0,
      // but the PDF coordinate system may be rotated.
      const rot = pd.pageRotation || 0;
      let cropX, cropY, cropW, cropH;

      if(rot === 90) {
        // Canvas X → PDF Y (from bottom), Canvas Y → PDF X
        const scx = pd.pdfH / pd.canvasW;
        const scy = pd.pdfW / pd.canvasH;
        cropX = pd.pdfX + pd.crop.y * scy;
        cropY = pd.pdfY + pd.pdfH - (pd.crop.x + pd.crop.w) * scx;
        cropW = pd.crop.h * scy;
        cropH = pd.crop.w * scx;
      } else if(rot === 270) {
        const scx = pd.pdfH / pd.canvasW;
        const scy = pd.pdfW / pd.canvasH;
        cropX = pd.pdfX + pd.pdfW - (pd.crop.y + pd.crop.h) * scy;
        cropY = pd.pdfY + pd.crop.x * scx;
        cropW = pd.crop.h * scy;
        cropH = pd.crop.w * scx;
      } else if(rot === 180) {
        const scx = pd.pdfW / pd.canvasW;
        const scy = pd.pdfH / pd.canvasH;
        cropX = pd.pdfX + pd.pdfW - (pd.crop.x + pd.crop.w) * scx;
        cropY = pd.pdfY + pd.crop.y * scy;
        cropW = pd.crop.w * scx;
        cropH = pd.crop.h * scy;
      } else {
        // rot === 0, normal case
        const scx = pd.pdfW / pd.canvasW;
        const scy = pd.pdfH / pd.canvasH;
        cropX = pd.pdfX + pd.crop.x * scx;
        cropY = pd.pdfY + (pd.pdfH - (pd.crop.y + pd.crop.h) * scy);
        cropW = pd.crop.w * scx;
        cropH = pd.crop.h * scy;
      }

      // ── Embed the source page as a Form XObject ────────────────────────────
      const [xobj] = await doc.embedPages([srcDoc.getPage(i-1)]);

      // pdf-lib gives us a PDFEmbeddedPage; get its name as registered
      // The tag used inside the stream must match what we register in Resources.
      const xName = 'Pg' + i;   // simple safe name, no special chars

      // ── Rewrite the page ───────────────────────────────────────────────────
      const pg = doc.getPage(i-1);
      pg.setSize(cropW, cropH);
      pg.setMediaBox(0, 0, cropW, cropH);
      pg.setCropBox(0, 0, cropW, cropH);
      pg.setBleedBox(0, 0, cropW, cropH);
      pg.setTrimBox(0, 0, cropW, cropH);

      // New content stream
      const stream = [
        'q',
        `0 0 ${f(cropW)} ${f(cropH)} re W n`,   // clip to new page size
        `1 0 0 1 ${f(-cropX)} ${f(-cropY)} cm`,  // shift so crop origin → (0,0)
        `/${xName} Do`,                           // draw the embedded page
        'Q'
      ].join('\n');

      const streamRef = doc.context.register(
        doc.context.stream(stream, { Length: stream.length })
      );
      pg.node.set(PDFLib.PDFName.of('Contents'), streamRef);

      // ── Register XObject in page Resources ────────────────────────────────
      // Build a fresh Resources dict so we don't inherit stale content
      const xObjDict = doc.context.obj({ [xName]: xobj.ref });
      const resDict  = doc.context.obj({ XObject: xObjDict });
      pg.node.set(PDFLib.PDFName.of('Resources'), resDict);
    }

    showProg(total,total,'שומר...');
    const bytes = await doc.save();
    const blob  = new Blob([bytes],{type:'application/pdf'});
    const url   = URL.createObjectURL(blob);
    const a     = document.createElement('a');
    a.href     = url;
    a.download = fileName.replace(/\.pdf$/i,'') + '_cropped.pdf';
    a.click();
    URL.revokeObjectURL(url);
    hideProg();
    document.getElementById('statusMsg').textContent='✅ הקובץ הורד בהצלחה!';
  }catch(err){
    console.error(err);
    hideProg();
    document.getElementById('statusMsg').textContent='❌ שגיאה: '+err.message;
  }
  document.getElementById('dlBtn').disabled=false;
}

const f=n=>n.toFixed(4);

function showProg(done,total,msg){
  document.getElementById('progressWrap').style.display='block';
  document.getElementById('progFill').style.width=Math.round((done/total)*100)+'%';
  if(msg)document.getElementById('statusMsg').textContent=msg;
}
function hideProg(){
  document.getElementById('progFill').style.width='100%';
  setTimeout(()=>{document.getElementById('progressWrap').style.display='none'},700);
}
function resetAll(){
  pdfBytes=null;pdfJsDoc=null;numPages=0;pages.length=0;
  document.getElementById('mainLayout').classList.remove('active');
  document.getElementById('pagesGrid').innerHTML='';
  document.getElementById('dropZone').style.display='';
  document.getElementById('dlBtn').disabled=true;
  document.getElementById('fileInput').value='';
  const sm=document.getElementById('statusMsg');if(sm)sm.textContent='';
  const pw=document.getElementById('progressWrap');if(pw)pw.style.display='none';
  window.scrollTo(0,0);
}
</script>
</body>
</html>
