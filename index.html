<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Cropper — חיתוך אמיתי</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap');
  :root {
    --bg:#0f0f13;--surface:#1a1a22;--surface2:#22222d;--border:#2e2e3d;
    --accent:#6c63ff;--text:#e8e8f0;--text2:#8888a0;--success:#4caf82;--radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:ltr}
  header{padding:1.25rem 2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:1rem;background:var(--surface)}
  .logo{width:36px;height:36px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px}
  header h1{font-size:19px;font-weight:700}
  header p{font-size:12px;color:var(--text2);direction:rtl}
  .container{max-width:1400px;margin:0 auto;padding:1.5rem 2rem}
  #dropZone{border:2px dashed var(--border);border-radius:var(--radius);padding:4rem 2rem;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface)}
  #dropZone:hover,#dropZone.dragover{border-color:var(--accent);background:rgba(108,99,255,.07)}
  #dropZone .icon{font-size:44px;margin-bottom:1rem}
  #dropZone h2{font-size:20px;font-weight:500;margin-bottom:.4rem}
  #dropZone p{color:var(--text2);font-size:13px;direction:rtl}
  #fileInput{display:none}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-family:'Heebo',sans-serif;font-size:13px;font-weight:500;transition:all .15s}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#7c74ff}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn-success{background:var(--success);color:#fff}
  .btn-success:hover{background:#5dc797}
  .btn-success:disabled,.btn-ghost:disabled{opacity:.4;cursor:not-allowed}
  .btn-sm{padding:5px 11px;font-size:12px}
  #mainLayout{display:none;gap:1.25rem;flex-direction:column}
  #mainLayout.active{display:flex}
  .toolbar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:var(--radius);padding:.9rem 1.25rem;border:1px solid var(--border);flex-wrap:wrap;gap:.75rem}
  .toolbar-left{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
  .file-info{font-size:13px;color:var(--text2)}
  .file-info strong{color:var(--text)}
  #hint{font-size:12px;color:var(--text2);direction:rtl;padding:.25rem 0}
  #pagesGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.25rem}
  .page-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;transition:border-color .2s}
  .page-card.has-crop{border-color:rgba(108,99,255,.5)}
  .card-head{display:flex;align-items:center;justify-content:space-between;padding:.65rem .9rem;background:var(--surface2);border-bottom:1px solid var(--border)}
  .page-label{font-size:13px;font-weight:500}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--text2);border:1px solid var(--border)}
  .badge.ok{background:rgba(76,175,130,.15);color:var(--success);border-color:rgba(76,175,130,.3)}
  .canvas-wrap{position:relative;background:#0a0a0e;display:flex;align-items:center;justify-content:center;min-height:180px;cursor:crosshair;user-select:none;overflow:hidden}
  .canvas-wrap canvas{display:block;max-width:100%}
  .card-foot{padding:.6rem .9rem;display:flex;align-items:center;gap:.5rem;border-top:1px solid var(--border);flex-wrap:wrap}
  .crop-info{font-size:11px;color:var(--text2);margin-right:auto;direction:rtl}
  .crop-info span{color:var(--accent)}
  .spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:2rem auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .progress-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
  .progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .25s;width:0}
  #statusMsg{font-size:12px;color:var(--text2);margin-top:.4rem;direction:rtl;min-height:1.2em}
  @media(max-width:600px){.container{padding:1rem}#pagesGrid{grid-template-columns:1fr}}

  /* Crop handles */
  .crop-handle{position:absolute;width:14px;height:14px;background:#fff;border:2px solid var(--accent);border-radius:3px;pointer-events:all;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.5);}
  .crop-handle.nw{cursor:nw-resize;top:-7px;left:-7px}
  .crop-handle.ne{cursor:ne-resize;top:-7px;right:-7px}
  .crop-handle.sw{cursor:sw-resize;bottom:-7px;left:-7px}
  .crop-handle.se{cursor:se-resize;bottom:-7px;right:-7px}
  .crop-handle.n{cursor:n-resize;top:-7px;left:calc(50% - 7px)}
  .crop-handle.s{cursor:s-resize;bottom:-7px;left:calc(50% - 7px)}
  .crop-handle.w{cursor:w-resize;top:calc(50% - 7px);left:-7px}
  .crop-handle.e{cursor:e-resize;top:calc(50% - 7px);right:-7px}
  .crop-move{cursor:move;position:absolute;top:0;left:0;right:0;bottom:0;z-index:5;}

  /* Preview modal */
  #previewModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;overflow-y:auto;padding:2rem 1rem;}
  #previewModal.open{display:flex;flex-direction:column;align-items:center;gap:1.5rem;}
  .preview-bar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:900px;position:sticky;top:0;background:rgba(15,15,19,.95);padding:.75rem 1rem;border-radius:10px;border:1px solid var(--border);backdrop-filter:blur(8px);}
  .preview-bar h2{font-size:15px;font-weight:600}
  .preview-page{background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.5);border-radius:4px;overflow:hidden;max-width:900px;width:100%;}
  .preview-page img{display:block;width:100%;}
  .preview-label{font-size:12px;color:var(--text2);align-self:flex-start;max-width:900px;width:100%;}
</style>
</head>
<body>
<header>
  <div class="logo">✂️</div>
  <div>
    <h1>PDF Cropper</h1>
    <p>חיתוך אמיתי — התוכן מחוץ לאזור נמחק לגמרי מהקובץ</p>
  </div>
</header>
<div class="container">
  <div id="dropZone" onclick="document.getElementById('fileInput').click()">
    <div class="icon">📄</div>
    <h2>גרור PDF לכאן</h2>
    <p>או לחץ לבחירת קובץ</p><br>
    <button class="btn btn-primary" onclick="event.stopPropagation();document.getElementById('fileInput').click()">📂 בחר קובץ PDF</button>
    <input type="file" id="fileInput" accept=".pdf">
  </div>

  <div id="mainLayout">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="file-info"><strong id="fileName">—</strong> &nbsp;·&nbsp; <strong id="pageCount">—</strong> עמודים</div>
        <button class="btn btn-ghost btn-sm" onclick="resetAll()">🔄 קובץ חדש</button>
      </div>
      <div style="display:flex;align-items:center;gap:.75rem">
        <button class="btn btn-ghost btn-sm" onclick="resetAll()" title="טען קובץ אחר">📂 קובץ חדש</button>
        <button class="btn btn-ghost btn-sm" id="previewBtn" onclick="openPreview()" disabled>👁 תצוגה מקדימה</button>
        <button class="btn btn-success" id="dlBtn" onclick="downloadCropped()" disabled>⬇️ הורד PDF מחותך</button>
      </div>
    </div>
    <div id="progressWrap" style="display:none">
      <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
      <div id="statusMsg"></div>
    </div>
    <p id="hint">✏️ גרור עם העכבר על כל עמוד לסימון אזור החיתוך. "החל על כולם" מעתיק חיתוך לכל העמודים.</p>
    <div id="pagesGrid"></div>
  </div>
</div>

<!-- Preview Modal -->
<div id="previewModal">
  <div class="preview-bar">
    <h2>👁 תצוגה מקדימה — אזורי חיתוך</h2>
    <button class="btn btn-ghost btn-sm" onclick="closePreview()">✕ סגור</button>
  </div>
  <div id="previewPages"></div>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfBytes=null, pdfJsDoc=null, numPages=0;
const pages=[];   // {canvasEl,canvasW,canvasH,pdfW,pdfH,pdfX,pdfY,crop,overlayEl}

// ── File ──────────────────────────────────────────────────────────────────────
const fi=document.getElementById('fileInput');
fi.addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0])});
// Allow re-selecting the same file after reset
fi.addEventListener('click',()=>{fi.value='';});
const dz=document.getElementById('dropZone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover')});
dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])});

async function loadFile(file){
  dz.style.display='none';
  document.getElementById('mainLayout').classList.add('active');
  document.getElementById('fileName').textContent=file.name;
  showProg(0,1,'טוען...');
  pdfBytes=await file.arrayBuffer();

  // ── CCITTFax detection & auto-conversion ─────────────────────────────────
  // CCITTFaxDecode is a fax-era compression that browsers can't decode.
  // We detect it by scanning the raw bytes for the filter name, then
  // re-render every page to a canvas and rebuild a JPEG-based PDF in memory.
  // The user sees nothing — the file just works.
  const rawText = new TextDecoder('latin1').decode(pdfBytes.slice(0, 32768));
  if(rawText.includes('CCITTFaxDecode') || rawText.includes('CCITTFax')) {
    showProg(0,1,'מזהה פורמט דחיסה ישן — ממיר אוטומטית...');
    pdfBytes = await convertCCITTtoPDF(pdfBytes);
    showProg(0,1,'המרה הושלמה, טוען...');
  }

  pdfJsDoc=await pdfjsLib.getDocument({data:pdfBytes.slice(0)}).promise;
  numPages=pdfJsDoc.numPages;
  document.getElementById('pageCount').textContent=numPages;
  pages.length=0;
  document.getElementById('pagesGrid').innerHTML='';

  // Pre-load pdf-lib once for all page dims
  const plibDoc=await PDFLib.PDFDocument.load(pdfBytes);

  for(let i=1;i<=numPages;i++){
    showProg(i-1,numPages,`מרנדר עמוד ${i}/${numPages}...`);
    buildCard(i);
    await renderPage(i,plibDoc);
  }
  hideProg();
  document.getElementById('dlBtn').disabled=false;
  document.getElementById('previewBtn').disabled=false;
}

// ── CCITTFax → JPEG-PDF converter ────────────────────────────────────────────
// Renders every page via PDF.js into an off-screen canvas, then assembles
// a fresh PDF with JPEG images using pdf-lib. Runs entirely in the browser.
async function convertCCITTtoPDF(srcBytes) {
  const srcDoc  = await pdfjsLib.getDocument({data: srcBytes.slice(0)}).promise;
  const outDoc  = await PDFLib.PDFDocument.create();
  const total   = srcDoc.numPages;

  for(let i = 1; i <= total; i++) {
    showProg(i-1, total, `ממיר עמוד ${i}/${total}...`);

    const pjsPage = await srcDoc.getPage(i);
    const vp      = pjsPage.getViewport({scale: 2.0}); // 2× for quality

    const canvas  = document.createElement('canvas');
    canvas.width  = vp.width;
    canvas.height = vp.height;
    const ctx     = canvas.getContext('2d');

    // White background (CCITTFax images are often transparent/black)
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    await pjsPage.render({canvasContext: ctx, viewport: vp}).promise;

    // Export as JPEG
    const jpegDataUrl = canvas.toDataURL('image/jpeg', 0.88);
    const jpegBase64  = jpegDataUrl.split(',')[1];
    const jpegBytes   = Uint8Array.from(atob(jpegBase64), c => c.charCodeAt(0));

    // Original page size (points)
    const origVp = pjsPage.getViewport({scale: 1});
    const pgW = origVp.width, pgH = origVp.height;

    const jpegImage = await outDoc.embedJpg(jpegBytes);
    const page      = outDoc.addPage([pgW, pgH]);
    page.drawImage(jpegImage, {x:0, y:0, width:pgW, height:pgH});
  }

  const outBytes = await outDoc.save();
  return outBytes.buffer;
}

function buildCard(i){
  const grid=document.getElementById('pagesGrid');
  const card=document.createElement('div');
  card.className='page-card';card.id=`card-${i}`;
  card.innerHTML=`
    <div class="card-head">
      <span class="page-label">עמוד ${i}</span>
      <span class="badge" id="badge-${i}">ללא חיתוך</span>
    </div>
    <div class="canvas-wrap" id="wrap-${i}"><div class="spinner"></div></div>
    <div class="card-foot">
      <span class="crop-info" id="info-${i}">—</span>
      <button class="btn btn-ghost btn-sm" onclick="applyToAll(${i})">📋 החל על כולם</button>
      <button class="btn btn-ghost btn-sm" onclick="clearCrop(${i})">✖</button>
    </div>`;
  grid.appendChild(card);
  pages[i-1]={canvasEl:null,canvasW:0,canvasH:0,pdfW:0,pdfH:0,pdfX:0,pdfY:0,crop:null,overlayEl:null};
}

async function renderPage(i,plibDoc){
  const idx=i-1;
  const pjsPage=await pdfJsDoc.getPage(i);
  // Store the page's natural rotation (used later for crop coordinate math)
  const pageRotation = pjsPage.rotate || 0;
  pages[idx].pageRotation = pageRotation;

  // Let PDF.js apply its own rotation — this gives the correct visual result.
  // We compute scale based on the ROTATED viewport so rotated pages fill the card properly.
  const baseVp = pjsPage.getViewport({scale: 1});   // includes natural rotation
  const baseLong = Math.max(baseVp.width, baseVp.height);
  const scale = Math.min(Math.max(900 / baseLong, 1.0), 4.0);
  const vp = pjsPage.getViewport({scale});           // natural rotation, correct scale

  const canvas = document.createElement('canvas');
  canvas.width  = vp.width;
  canvas.height = vp.height;

  await pjsPage.render({canvasContext: canvas.getContext('2d'), viewport: vp}).promise;

  const wrap=document.getElementById(`wrap-${i}`);
  wrap.innerHTML='';wrap.appendChild(canvas);

  const plibPage=plibDoc.getPage(idx);
  const mb=plibPage.getMediaBox();

  pages[idx].canvasEl=canvas;
  pages[idx].canvasW=canvas.width;pages[idx].canvasH=canvas.height;
  pages[idx].pdfW=mb.width;pages[idx].pdfH=mb.height;
  pages[idx].pdfX=mb.x||0;pages[idx].pdfY=mb.y||0;

  attachDrag(i,wrap,canvas);
}

// ── Drag + Handle + Move system ──────────────────────────────────────────────
function attachDrag(i,wrap,canvas){
  // mode: 'draw' | 'move' | 'resize-nw'|'ne'|'sw'|'se'|'n'|'s'|'w'|'e'
  let mode=null, sx=0, sy=0, startCrop=null;

  function cpos(e){
    const r=canvas.getBoundingClientRect();
    const kx=canvas.width/r.width, ky=canvas.height/r.height;
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    return{
      x:Math.max(0,Math.min(canvas.width, (cx-r.left)*kx)),
      y:Math.max(0,Math.min(canvas.height,(cy-r.top)*ky))
    };
  }
  function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}

  // Draw new crop on bare canvas
  canvas.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    mode='draw'; ({x:sx,y:sy}=cpos(e)); e.preventDefault();
  });
  canvas.addEventListener('touchstart',e=>{
    mode='draw'; ({x:sx,y:sy}=cpos(e)); e.preventDefault();
  },{passive:false});

  // Global move handler
  function onMove(e){
    if(!mode)return;
    const p=cpos(e);
    const pd=pages[i-1];
    if(mode==='draw'){
      drawOv(i,sx,sy,p.x,p.y);
    } else if(mode==='move'){
      const dx=p.x-sx, dy=p.y-sy;
      const nx=clamp(startCrop.x+dx, 0, pd.canvasW-startCrop.w);
      const ny=clamp(startCrop.y+dy, 0, pd.canvasH-startCrop.h);
      pd.crop={x:nx,y:ny,w:startCrop.w,h:startCrop.h};
      redrawOv(i);
    } else {
      // resize
      let {x,y,w,h}=startCrop;
      const dx=p.x-sx, dy=p.y-sy;
      if(mode.includes('e')) w=clamp(startCrop.w+dx,20,pd.canvasW-x);
      if(mode.includes('s')) h=clamp(startCrop.h+dy,20,pd.canvasH-y);
      if(mode.includes('w')){
        const nx=clamp(startCrop.x+dx,0,startCrop.x+startCrop.w-20);
        w=startCrop.x+startCrop.w-nx; x=nx;
      }
      if(mode.includes('n')){
        const ny=clamp(startCrop.y+dy,0,startCrop.y+startCrop.h-20);
        h=startCrop.y+startCrop.h-ny; y=ny;
      }
      pd.crop={x,y,w,h};
      redrawOv(i);
    }
  }
  window.addEventListener('mousemove',onMove);
  canvas.addEventListener('touchmove',e=>{onMove(e);e.preventDefault();},{passive:false});

  function onUp(e){
    if(!mode)return;
    if(mode==='draw'){
      const p=cpos(e);
      const x=Math.min(sx,p.x),y=Math.min(sy,p.y);
      const w=Math.abs(p.x-sx),h=Math.abs(p.y-sy);
      if(w>8&&h>8){pages[i-1].crop={x,y,w,h};redrawOv(i);updateBadge(i);}
      else if(!pages[i-1].crop) clearCrop(i);
    } else {
      updateBadge(i);
    }
    mode=null;
  }
  window.addEventListener('mouseup',onUp);
  canvas.addEventListener('touchend',e=>{
    const t=e.changedTouches[0],r=canvas.getBoundingClientRect();
    const kx=canvas.width/r.width,ky=canvas.height/r.height;
    // fake mouse event for onUp
    onUp({touches:[],clientX:t.clientX,clientY:t.clientY,
          _r:r,_kx:kx,_ky:ky});
  });

  // Start move/resize from overlay handles — called by renderHandles
  wrap._startInteraction = function(m, e){
    const p=cpos(e);
    mode=m; sx=p.x; sy=p.y;
    startCrop={...pages[i-1].crop};
    e.preventDefault(); e.stopPropagation();
  };
}

// Redraw overlay from stored crop (no start/end coords needed)
function redrawOv(i){
  const pd=pages[i-1];
  if(!pd.crop)return;
  const {x,y,w,h}=pd.crop;
  drawOvRect(i,x,y,w,h);
}

function drawOv(i,x1,y1,x2,y2){
  const x=Math.min(x1,x2),y=Math.min(y1,y2);
  const w=Math.abs(x2-x1),h=Math.abs(y2-y1);
  drawOvRect(i,x,y,w,h);
}

function drawOvRect(i,x,y,w,h){
  const pd=pages[i-1];
  const wrap=document.getElementById(`wrap-${i}`);
  if(!pd.canvasEl)return;
  if(!pd.overlayEl){
    pd.overlayEl=document.createElement('div');
    pd.overlayEl.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;';
    wrap.style.position='relative';
    wrap.appendChild(pd.overlayEl);
  }
  const r=pd.canvasEl.getBoundingClientRect();
  const kx=r.width/pd.canvasW, ky=r.height/pd.canvasH;
  const rx=x*kx, ry=y*ky, rw=w*kx, rh=h*ky;
  const pw=r.width, ph=r.height;

  const HANDLES=['nw','n','ne','w','e','sw','s','se'];
  const handlesHTML=HANDLES.map(hk=>`
    <div class="crop-handle ${hk}"
      onmousedown="document.getElementById('wrap-${i}')._startInteraction('resize-${hk}',event)"
      ontouchstart="document.getElementById('wrap-${i}')._startInteraction('resize-${hk}',event)">
    </div>`).join('');

  pd.overlayEl.innerHTML=`
    <div style="position:absolute;top:0;left:0;width:${pw}px;height:${ry}px;background:rgba(0,0,0,.52)"></div>
    <div style="position:absolute;top:${ry+rh}px;left:0;width:${pw}px;bottom:0;background:rgba(0,0,0,.52)"></div>
    <div style="position:absolute;top:${ry}px;left:0;width:${rx}px;height:${rh}px;background:rgba(0,0,0,.52)"></div>
    <div style="position:absolute;top:${ry}px;left:${rx+rw}px;right:0;height:${rh}px;background:rgba(0,0,0,.52)"></div>
    <div style="position:absolute;top:${ry}px;left:${rx}px;width:${rw}px;height:${rh}px;
      border:2px solid #6c63ff;pointer-events:all;cursor:move;"
      onmousedown="document.getElementById('wrap-${i}')._startInteraction('move',event)"
      ontouchstart="document.getElementById('wrap-${i}')._startInteraction('move',event)">
      ${handlesHTML}
    </div>`;

  const scx=pd.pdfW/pd.canvasW,scy=pd.pdfH/pd.canvasH;
  document.getElementById(`info-${i}`).innerHTML=
    `גודל: <span>${Math.round(w*scx)} × ${Math.round(h*scy)}</span> pt`;
}

function drawOv(i,x1,y1,x2,y2){
  const pd=pages[i-1];const wrap=document.getElementById(`wrap-${i}`);
  if(!pd.canvasEl)return;
  if(!pd.overlayEl){
    pd.overlayEl=document.createElement('div');
    pd.overlayEl.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;';
    wrap.style.position='relative';wrap.appendChild(pd.overlayEl);
  }
  const r=pd.canvasEl.getBoundingClientRect();
  const kx=r.width/pd.canvasW,ky=r.height/pd.canvasH;
  const rx=Math.min(x1,x2)*kx,ry=Math.min(y1,y2)*ky;
  const rw=Math.abs(x2-x1)*kx,rh=Math.abs(y2-y1)*ky;
  const pw=r.width;
  pd.overlayEl.innerHTML=`
    <div style="position:absolute;top:0;left:0;width:${pw}px;height:${ry}px;background:rgba(0,0,0,.55)"></div>
    <div style="position:absolute;top:${ry+rh}px;left:0;width:${pw}px;bottom:0;background:rgba(0,0,0,.55)"></div>
    <div style="position:absolute;top:${ry}px;left:0;width:${rx}px;height:${rh}px;background:rgba(0,0,0,.55)"></div>
    <div style="position:absolute;top:${ry}px;left:${rx+rw}px;right:0;height:${rh}px;background:rgba(0,0,0,.55)"></div>
    <div style="position:absolute;top:${ry}px;left:${rx}px;width:${rw}px;height:${rh}px;border:2px solid #6c63ff"></div>`;
  const scx=pd.pdfW/pd.canvasW,scy=pd.pdfH/pd.canvasH;
  document.getElementById(`info-${i}`).innerHTML=
    `גודל: <span>${Math.round(Math.abs(x2-x1)*scx)} × ${Math.round(Math.abs(y2-y1)*scy)}</span> pt`;
}

function updateBadge(i){
  const b=document.getElementById(`badge-${i}`),c=document.getElementById(`card-${i}`);
  if(pages[i-1].crop){b.textContent='✓ מסומן';b.className='badge ok';c.classList.add('has-crop')}
  else{b.textContent='ללא חיתוך';b.className='badge';c.classList.remove('has-crop')}
}
function clearCrop(i){
  pages[i-1].crop=null;
  if(pages[i-1].overlayEl)pages[i-1].overlayEl.innerHTML='';
  document.getElementById(`info-${i}`).innerHTML='—';
  updateBadge(i);
}
function applyToAll(src){
  const pd=pages[src-1];
  if(!pd.crop){alert('סמן חיתוך בעמוד הזה קודם.');return}
  const rx=pd.crop.x/pd.canvasW,ry=pd.crop.y/pd.canvasH;
  const rw=pd.crop.w/pd.canvasW,rh=pd.crop.h/pd.canvasH;
  for(let i=1;i<=numPages;i++){
    if(i===src)continue;
    const t=pages[i-1];if(!t.canvasW)continue;
    t.crop={x:rx*t.canvasW,y:ry*t.canvasH,w:rw*t.canvasW,h:rh*t.canvasH};
    redrawOv(i);
    updateBadge(i);
  }
}

// ── Preview modal ────────────────────────────────────────────────────────────
async function openPreview(){
  const modal=document.getElementById('previewModal');
  const container=document.getElementById('previewPages');
  container.innerHTML='<p style="color:var(--text2);font-size:13px;direction:rtl">טוען תצוגה מקדימה...</p>';
  modal.classList.add('open');
  document.body.style.overflow='hidden';

  container.innerHTML='';
  let hasCrop=false;

  for(let i=1;i<=numPages;i++){
    const pd=pages[i-1];
    if(!pd.canvasEl)continue;

    const label=document.createElement('p');
    label.className='preview-label';

    if(pd.crop){
      hasCrop=true;
      // Draw cropped region onto a temporary canvas
      const {x,y,w,h}=pd.crop;
      const tmpCanvas=document.createElement('canvas');
      tmpCanvas.width=Math.round(w);
      tmpCanvas.height=Math.round(h);
      const ctx=tmpCanvas.getContext('2d');
      ctx.drawImage(pd.canvasEl, x,y,w,h, 0,0,w,h);

      const scx=pd.pdfW/pd.canvasW,scy=pd.pdfH/pd.canvasH;
      label.textContent=`עמוד ${i} — חתוך ל־${Math.round(w*scx)}×${Math.round(h*scy)} pt`;
      label.style.color='var(--success)';

      const wrap=document.createElement('div');
      wrap.className='preview-page';
      const img=document.createElement('img');
      img.src=tmpCanvas.toDataURL('image/jpeg',0.9);
      wrap.appendChild(img);
      container.appendChild(label);
      container.appendChild(wrap);
    } else {
      label.textContent=`עמוד ${i} — ללא חיתוך (יישמר מלא)`;
      label.style.color='var(--text2)';
      container.appendChild(label);
    }
  }

  if(!hasCrop){
    container.innerHTML='<p style="color:var(--text2);font-size:14px;direction:rtl;text-align:center;padding:2rem">לא סומן אף אזור חיתוך. גרור על עמוד כדי לסמן.</p>';
  }
}

function closePreview(){
  document.getElementById('previewModal').classList.remove('open');
  document.body.style.overflow='';
}

// Close modal on backdrop click
document.getElementById('previewModal').addEventListener('click',function(e){
  if(e.target===this)closePreview();
});
// Close on Escape
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePreview();});

// Enable preview button when file loaded
const _origHideProg=hideProg;

// ── TRUE HARD-CODED CROP ──────────────────────────────────────────────────────
// Each cropped page is rebuilt from scratch:
//   1. Embed original page as Form XObject into the output doc
//   2. Resize the page to the exact crop dimensions
//   3. Write a new content stream: clip rect → translate → draw XObject
//   The content outside the crop rect is never drawn — it does not exist.
async function downloadCropped(){
  document.getElementById('dlBtn').disabled=true;
  const pb=document.getElementById('previewBtn');if(pb)pb.disabled=true;
  const fileName = document.getElementById('fileName').textContent || 'document';
  showProg(0,numPages,'מכין...');
  try{
    // Load two independent copies: one to edit, one as embed source
    const doc    = await PDFLib.PDFDocument.load(pdfBytes);
    const srcDoc = await PDFLib.PDFDocument.load(pdfBytes);
    const total  = doc.getPageCount();

    for(let i=1;i<=total;i++){
      showProg(i-1,total,`מחתך עמוד ${i}/${total}...`);
      const pd=pages[i-1];
      if(!pd||!pd.crop)continue;

      // ── Convert canvas crop → PDF point space ──────────────────────────────
      // PDF.js renders with native rotation, so canvas axes already match the
      // visual. We just need to map canvas pixels → PDF user-space points.
      // PDF.js viewport tells us exactly the canvas→PDF transform via its
      // transform matrix, but the simplest correct approach:
      //   canvasW/H already reflects the rotated page dimensions,
      //   pdfW/H are the MediaBox dims (pre-rotation).
      const rot = pd.pageRotation || 0;
      let cropX, cropY, cropW, cropH;

      // For rotated pages, canvas W corresponds to PDF H and vice-versa
      const isLandscape = (rot === 90 || rot === 270);
      const pdfVisW = isLandscape ? pd.pdfH : pd.pdfW; // visual width in PDF space
      const pdfVisH = isLandscape ? pd.pdfW : pd.pdfH; // visual height in PDF space

      const scx = pdfVisW / pd.canvasW;
      const scy = pdfVisH / pd.canvasH;

      // Crop in visual/canvas space (top-left origin):
      const visX = pd.crop.x * scx;
      const visY = pd.crop.y * scy;
      const visW = pd.crop.w * scx;
      const visH = pd.crop.h * scy;

      // Convert visual space → PDF user space (bottom-left origin, accounting for rotation)
      if(rot === 0) {
        cropX = pd.pdfX + visX;
        cropY = pd.pdfY + pd.pdfH - (visY + visH);
        cropW = visW; cropH = visH;
      } else if(rot === 90) {
        // PDF origin is bottom-left of unrotated page
        cropX = pd.pdfX + visY;
        cropY = pd.pdfY + visX;
        cropW = visH; cropH = visW;
      } else if(rot === 180) {
        cropX = pd.pdfX + pd.pdfW - (visX + visW);
        cropY = pd.pdfY + visY;
        cropW = visW; cropH = visH;
      } else { // 270
        cropX = pd.pdfX + pd.pdfW - (visY + visH);
        cropY = pd.pdfY + pd.pdfH - (visX + visW);
        cropW = visH; cropH = visW;
      }

      // ── Embed the source page as a Form XObject ────────────────────────────
      const [xobj] = await doc.embedPages([srcDoc.getPage(i-1)]);

      // pdf-lib gives us a PDFEmbeddedPage; get its name as registered
      // The tag used inside the stream must match what we register in Resources.
      const xName = 'Pg' + i;   // simple safe name, no special chars

      // ── Rewrite the page ───────────────────────────────────────────────────
      const pg = doc.getPage(i-1);
      pg.setSize(cropW, cropH);
      pg.setMediaBox(0, 0, cropW, cropH);
      pg.setCropBox(0, 0, cropW, cropH);
      pg.setBleedBox(0, 0, cropW, cropH);
      pg.setTrimBox(0, 0, cropW, cropH);

      // New content stream
      const stream = [
        'q',
        `0 0 ${f(cropW)} ${f(cropH)} re W n`,   // clip to new page size
        `1 0 0 1 ${f(-cropX)} ${f(-cropY)} cm`,  // shift so crop origin → (0,0)
        `/${xName} Do`,                           // draw the embedded page
        'Q'
      ].join('\n');

      const streamRef = doc.context.register(
        doc.context.stream(stream, { Length: stream.length })
      );
      pg.node.set(PDFLib.PDFName.of('Contents'), streamRef);

      // ── Register XObject in page Resources ────────────────────────────────
      // Build a fresh Resources dict so we don't inherit stale content
      const xObjDict = doc.context.obj({ [xName]: xobj.ref });
      const resDict  = doc.context.obj({ XObject: xObjDict });
      pg.node.set(PDFLib.PDFName.of('Resources'), resDict);
    }

    showProg(total,total,'שומר...');
    const bytes = await doc.save();
    const blob  = new Blob([bytes],{type:'application/pdf'});
    const url   = URL.createObjectURL(blob);
    const a     = document.createElement('a');
    a.href     = url;
    a.download = fileName.replace(/\.pdf$/i,'') + '_cropped.pdf';
    a.click();
    URL.revokeObjectURL(url);
    hideProg();
    document.getElementById('statusMsg').textContent='✅ הקובץ הורד בהצלחה!';
  }catch(err){
    console.error(err);
    hideProg();
    document.getElementById('statusMsg').textContent='❌ שגיאה: '+err.message;
  }
  document.getElementById('dlBtn').disabled=false;
}

const f=n=>n.toFixed(4);

function showProg(done,total,msg){
  document.getElementById('progressWrap').style.display='block';
  document.getElementById('progFill').style.width=Math.round((done/total)*100)+'%';
  if(msg)document.getElementById('statusMsg').textContent=msg;
}
function hideProg(){
  document.getElementById('progFill').style.width='100%';
  setTimeout(()=>{document.getElementById('progressWrap').style.display='none'},700);
}
function resetAll(){
  pdfBytes=null;pdfJsDoc=null;numPages=0;pages.length=0;
  document.getElementById('mainLayout').classList.remove('active');
  document.getElementById('pagesGrid').innerHTML='';
  document.getElementById('dropZone').style.display='';
  document.getElementById('dlBtn').disabled=true;
  document.getElementById('fileInput').value='';
  const sm=document.getElementById('statusMsg');if(sm)sm.textContent='';
  const pw=document.getElementById('progressWrap');if(pw)pw.style.display='none';
  window.scrollTo(0,0);
}
